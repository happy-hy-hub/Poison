<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

    body { margin: 0; font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #9A9AA2; } a:hover { color: #C6C6CC; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0A0A0B; color: #E8E8EA; position: relative; display: flex; flex-direction: column;">

  <div style="height: 54px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 44px; flex-shrink: 0;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6A6A72; letter-spacing: 0.36em;">ASH</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A5A62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
  </div>

  <div style="padding: 6px 20px 12px 20px; flex-shrink: 0;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.08em;">6件　／　これまでに 143件</div>
  </div>

  <div style="flex-grow: 1; padding: 0 20px; overflow: hidden; display: flex; flex-direction: column;">

    <div style="padding: 16px 0 17px 0; border-top: 1px solid #17171C; display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 14.5px; line-height: 1.72; color: #C6C6CC; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">「みんな言ってるよ」って、みんなって誰だよ。名前を出せないなら、それはあなたの意見でしょう。</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.04em;">2時間前</div>
    </div>

    <div style="padding: 16px 0 17px 0; border-top: 1px solid #17171C; display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 14.5px; line-height: 1.72; color: #C6C6CC; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">順番待ちの列に横入りされた。何も言えなかった自分にも腹が立つ。</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.04em;">5時間前</div>
    </div>

    <div style="padding: 16px 0 17px 0; border-top: 1px solid #17171C; display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 14.5px; line-height: 1.72; color: #C6C6CC; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">会議で提案を全部否定された。理由も言わずに。あの言い方、思い出すだけで胃が痛くなる。</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.04em;">昨日</div>
    </div>

    <div style="padding: 16px 0 17px 0; border-top: 1px solid #17171C; display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 14.5px; line-height: 1.72; color: #C6C6CC; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">体調が悪いと言っているのに、気の持ちようだと返された。</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.04em;">2日前</div>
    </div>

    <div style="padding: 16px 0 17px 0; border-top: 1px solid #17171C; display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 14.5px; line-height: 1.72; color: #C6C6CC; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">電車で肩がぶつかったのに、こちらを睨んで通り過ぎていった。</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.04em;">3日前</div>
    </div>

    <div style="padding: 16px 0 17px 0; border-top: 1px solid #17171C; border-bottom: 1px solid #17171C; display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 14.5px; line-height: 1.72; color: #C6C6CC; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">返信がないまま三日。既読だけついている。</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #45454C; letter-spacing: 0.04em;">6日前</div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, #0A0A0B 42%, rgba(10, 10, 11, 0)); pointer-events: none;"></div>

  <div style="position: absolute; right: 20px; bottom: 30px; width: 56px; height: 56px; border-radius: 28px; background: #16161A; border: 1px solid #2C2C34; display: flex; align-items: center; justify-content: center;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#AFAFB7" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"></path>
    </svg>
  </div>

</div>
</x-dc>
</body>
</html>
