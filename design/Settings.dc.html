<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #9A9AA2; } a:hover { color: #C6C6CC; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0A0A0B; color: #E8E8EA; position: relative; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; padding: 0 12px; flex-shrink: 0; height: 44px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A8A92" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"></path>
      </svg>
    </div>
    <div style="font-size: 16px; font-weight: 500; letter-spacing: 0.06em; margin-left: 4px;">設定</div>
  </div>

  <div style="flex-grow: 1; padding: 22px 20px 0 20px; display: flex; flex-direction: column; gap: 30px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #45454C; letter-spacing: 0.22em; padding-left: 1px;">ロック</div>
      <div style="background: #111113; border: 1px solid #1D1D22; border-radius: 6px; display: flex; flex-direction: column;">
        <div style="height: 52px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 14px; color: #C6C6CC;">アプリを開くときにロック</div>
          <div style="width: 44px; height: 26px; border-radius: 13px; background: #24242A; display: flex; align-items: center; padding: 0 3px;">
            <div style="width: 20px; height: 20px; border-radius: 10px; background: #55555C;"></div>
          </div>
        </div>
        <div style="height: 1px; background: #18181C; margin: 0 15px;"></div>
        <div style="height: 52px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; opacity: 0.38;">
          <div style="font-size: 14px; color: #C6C6CC;">ロックの方法</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A7A82;">生体認証 ／ PIN</div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #45454C; letter-spacing: 0.22em; padding-left: 1px;">消し方</div>
      <div style="background: #111113; border: 1px solid #1D1D22; border-radius: 6px; display: flex; flex-direction: column;">
        <div style="height: 56px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 14px; color: #C6C6CC;">消し方</div>
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="font-size: 13.5px; color: #C08055;">燃やす</div>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#45454C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5l7 7-7 7"></path>
            </svg>
          </div>
        </div>
        <div style="height: 1px; background: #18181C; margin: 0 15px;"></div>
        <div style="height: 52px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 14px; color: #C6C6CC;">振動</div>
          <div style="width: 44px; height: 26px; border-radius: 13px; background: #6E6E78; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px;">
            <div style="width: 20px; height: 20px; border-radius: 10px; background: #F0F0F2;"></div>
          </div>
        </div>
        <div style="height: 1px; background: #18181C; margin: 0 15px;"></div>
        <div style="height: 52px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 14px; color: #C6C6CC;">効果音</div>
          <div style="width: 44px; height: 26px; border-radius: 13px; background: #24242A; display: flex; align-items: center; padding: 0 3px;">
            <div style="width: 20px; height: 20px; border-radius: 10px; background: #55555C;"></div>
          </div>
        </div>
        <div style="height: 1px; background: #18181C; margin: 0 15px;"></div>
        <div style="height: 52px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 14px; color: #C6C6CC;">演出を控えめにする</div>
          <div style="width: 44px; height: 26px; border-radius: 13px; background: #24242A; display: flex; align-items: center; padding: 0 3px;">
            <div style="width: 20px; height: 20px; border-radius: 10px; background: #55555C;"></div>
          </div>
        </div>
      </div>
    </div>

    <div style="border: 1px solid #1A1A1E; border-radius: 6px; padding: 15px 16px; display: flex; gap: 12px; align-items: flex-start;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#55555C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;">
        <path d="M12 2.6l7.6 3.2v5.4c0 4.7-3.2 8.7-7.6 10-4.4-1.3-7.6-5.3-7.6-10V5.8z"></path>
      </svg>
      <div style="font-size: 12px; line-height: 1.9; color: #6E6E76; text-wrap: pretty;">このアプリは通信しません。書いた内容は端末の中だけに保存され、外に出ることはありません。</div>
    </div>

  </div>

  <div style="flex-shrink: 0; padding: 0 20px 32px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 12.5px; color: #6E6E76;">相談できる窓口</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #33333A;">v1.0.0</div>
  </div>

</div>

</html>
