name: Deploy PWA to GitHub Pages

# master に push されるたびに PWA を組み立てて公開する。
# 手動でも回せる（Actions タブの Run workflow）。
#
# 初回だけリポジトリ側の設定が要る:
#   Settings → Pages → Source を「GitHub Actions」にする

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。後から来たものを優先する。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 は Node 22.13 以上を要求する
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 依存を入れる
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: PWA を組み立てる
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
